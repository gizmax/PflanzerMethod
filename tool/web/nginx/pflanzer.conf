# pflanzer.cz/method — reverse proxy with /api → backend, /method/* → static SPA
# (HTTPS via Let's Encrypt; certbot expected to mount /etc/letsencrypt).
#
# DEV variant: no authentication in front of the hub; backend runs with
# PFLANZER_HUB_AUTH_MODE=dev and trusts the X-User header. For company
# deployments use pflanzer.oidc.conf (oauth2-proxy / SSO) — see ../README-auth.md.

server {
    listen 80;
    server_name pflanzer.cz www.pflanzer.cz;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pflanzer.cz www.pflanzer.cz;

    ssl_certificate     /etc/letsencrypt/live/pflanzer.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pflanzer.cz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Sandbox / governance headers
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API → FastAPI backend
    location /method/api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Static SPA → /method/
    location /method/ {
        alias /var/www/method/;
        try_files $uri $uri/ /method/index.html;
        expires 1h;
        add_header Cache-Control "public, no-cache" always;
    }

    # Root → simple landing (TBD: methodology presentation page)
    location / {
        return 302 /method/;
    }
}

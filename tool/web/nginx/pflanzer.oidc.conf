# pflanzer.cz/method — OIDC variant (SSO via oauth2-proxy, nginx auth_request).
# Selected by PFLANZER_NGINX_CONF=pflanzer.oidc.conf (see ../.env.example).
# Backend must run with PFLANZER_HUB_AUTH_MODE=oidc. Docs: ../README-auth.md.
#
# Identity flow: nginx asks oauth2-proxy (/oauth2/auth) on every request,
# copies X-Auth-Request-Email/-User from its response into X-Forwarded-Email/
# X-Forwarded-User for the backend and drops any client-supplied X-User.
# The backend writes that e-mail into feedback.submitted_by and audit_log.actor.

server {
    listen 80;
    server_name pflanzer.cz www.pflanzer.cz;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pflanzer.cz www.pflanzer.cz;

    ssl_certificate     /etc/letsencrypt/live/pflanzer.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pflanzer.cz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Sandbox / governance headers
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # oauth2-proxy endpoints (sign_in, callback, sign_out)
    location /oauth2/ {
        proxy_pass         http://oauth2-proxy:4180;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Auth-Request-Redirect $request_uri;
    }

    # Subrequest target for auth_request (202 = authenticated, 401 = not)
    location = /oauth2/auth {
        internal;
        proxy_pass              http://oauth2-proxy:4180;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Content-Length "";
        proxy_pass_request_body off;
    }

    # Liveness probe stays unauthenticated
    location = /method/api/health {
        proxy_pass         http://backend:8000/api/health;
        proxy_set_header   Host $host;
    }

    # API → FastAPI backend (SSO required). No sign_in redirect here: XHR
    # clients get a plain 401 and the SPA shows an error instead of HTML.
    location /method/api/ {
        auth_request       /oauth2/auth;
        auth_request_set   $pf_user  $upstream_http_x_auth_request_user;
        auth_request_set   $pf_email $upstream_http_x_auth_request_email;

        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Email $pf_email;
        proxy_set_header   X-Forwarded-User $pf_user;
        proxy_set_header   X-User "";
    }

    # Static SPA → /method/ (SSO required, browser is redirected to sign-in)
    location /method/ {
        auth_request       /oauth2/auth;
        # sign_in returns the user to the original URL via X-Auth-Request-Redirect
        error_page 401 = /oauth2/sign_in;

        alias /var/www/method/;
        try_files $uri $uri/ /method/index.html;
        expires 1h;
        add_header Cache-Control "private, no-cache" always;
    }

    # Root → simple landing (TBD: methodology presentation page)
    location / {
        return 302 /method/;
    }
}

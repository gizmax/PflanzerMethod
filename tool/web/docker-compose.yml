# Auth modes (see README-auth.md):
#   dev  (default)  docker compose up
#                   → backend PFLANZER_HUB_AUTH_MODE=dev, nginx/pflanzer.conf, no SSO
#   oidc            cp .env.example .env  (fill in IdP values)
#                   docker compose --profile oidc up
#                   → oauth2-proxy + nginx/pflanzer.oidc.conf, backend PFLANZER_HUB_AUTH_MODE=oidc
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ../../data:/app/data:rw
    environment:
      - PYTHONUNBUFFERED=1
      - PFLANZER_HUB_AUTH_MODE=${PFLANZER_HUB_AUTH_MODE:-dev}
    expose:
      - "8000"
    restart: unless-stopped

  frontend-build:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm ci && npm run build"
    profiles: ["build"]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    profiles: ["oidc"]
    environment:
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_OIDC_ISSUER_URL=${OAUTH2_PROXY_OIDC_ISSUER_URL:-}
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_PROXY_CLIENT_ID:-}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET:-}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET:-}
      - OAUTH2_PROXY_EMAIL_DOMAINS=${OAUTH2_PROXY_EMAIL_DOMAINS:-}
      - OAUTH2_PROXY_REDIRECT_URL=${OAUTH2_PROXY_REDIRECT_URL:-https://pflanzer.cz/oauth2/callback}
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      # auth_request mode: no upstream, return 202 + X-Auth-Request-* headers
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_SCOPE=openid email profile
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
    expose:
      - "4180"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # pflanzer.conf (dev) or pflanzer.oidc.conf (SSO), set in .env
      - ./nginx/${PFLANZER_NGINX_CONF:-pflanzer.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/method:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_started
      oauth2-proxy:
        condition: service_started
        required: false  # only present with the oidc profile
    restart: unless-stopped
